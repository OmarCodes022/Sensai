site_name: Sensai Documentation
site_description: Documentation of Sensai, a local command-line AI assistant for a skincare creator
site_url: https://omarcodes022.github.io/Sensai/
repo_name: OmarCodes022/Sensai
repo_url: https://github.com/OmarCodes022/Sensai
edit_uri: edit/main/docs/
docs_dir: docs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: README.md
  - Overview:
      - Features: overview/features.md
      - How it works: overview/how-it-works.md
      - User stories: overview/user-stories.md
  - User guide:
      - Install and configure: user-guide/install.md
      - Chatting: user-guide/chatting.md
      - Personas: user-guide/personas.md
      - Sessions and profile: user-guide/sessions.md
      - Tools and sandbox: user-guide/tools.md
      - Reasoning step by step: user-guide/thinking.md
      - Document search: user-guide/documents.md
      - Brand facts: user-guide/brand-facts.md
      - Guardrails: user-guide/guardrails.md
      - File access: user-guide/files.md
      - Campaign document: user-guide/campaign.md
      - Questions and forms: user-guide/questions.md
      - Web search: user-guide/web-search.md
      - Private export: user-guide/export.md
      - Scheduled drafts: user-guide/scheduling.md
  - Developer guide:
      - Architecture: developer-guide/architecture.md
      - File structure: developer-guide/file-structure.md
      - Storage: developer-guide/storage.md
      - Extending: developer-guide/extending.md
      - Testing: developer-guide/testing.md
      - Contributing: developer-guide/contributing.md

exclude_docs: |
  architecture/
  product/
  operations/
  tasks/
  diagrams/
  stories/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
