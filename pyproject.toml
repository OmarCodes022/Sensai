[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "pydantic-settings>=2.2", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sensai = "sensai.cli.main:main"
sensai-remote = "sensai.cli.remote:main"
sensai-web = "sensai_web.cli:main"

[tool.setuptools.packages.find]
where = ["src", "web"]
include = ["sensai*"]
namespaces = false

[tool.setuptools.package-data]
"sensai" = ["engagement_demo.csv"]
"sensai.chat" = ["personas.json", "system_prompt.txt", "examples.json"]
"sensai_web" = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "web", "tests/helpers"]
testpaths = ["tests"]
