name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit tests
    if: github.repository == 'OmarCodes022/Sensai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q tests/unit

  mirror:
    name: Mirror to Epitech
    if: github.repository == 'OmarCodes022/Sensai' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_MIRROR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MIRROR_OIDC_ROLE_ARN }}
          aws-region: eu-west-3
      - name: Fast-forward Epitech main
        run: |
          printf '{"sha":"%s"}' "$GITHUB_SHA" > "$RUNNER_TEMP/mirror-request.json"
          aws lambda invoke --function-name sensai-main-mirror \
            --payload "fileb://$RUNNER_TEMP/mirror-request.json" \
            "$RUNNER_TEMP/mirror-result.json" > "$RUNNER_TEMP/mirror-metadata.json"
          python3 - "$RUNNER_TEMP/mirror-metadata.json" "$RUNNER_TEMP/mirror-result.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as response:
              metadata = json.load(response)
          if metadata.get("StatusCode") != 200 or metadata.get("FunctionError"):
              raise SystemExit("AWS mirror failed; inspect the Lambda log")
          with open(sys.argv[2], encoding="utf-8") as response:
              result = json.load(response)
          if result.get("status") == "superseded":
              print(f"Commit {sys.argv[3]} was superseded by {result['source']}")
          elif result.get("status") in ("mirrored", "up_to_date") and result.get("source") == sys.argv[3]:
              print(f"Epitech main matches personal main at {sys.argv[3]}")
          else:
              raise SystemExit("AWS mirror did not confirm this personal main commit")
          PY
