name: Test personal main and authorize AWS mirror

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    if: github.repository == 'OmarCodes022/Sensai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q tests/unit

  authorize-aws-mirror:
    if: github.repository == 'OmarCodes022/Sensai' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_MIRROR_ENABLED == 'true'
    needs: [unit-tests]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MIRROR_OIDC_ROLE_ARN }}
          aws-region: eu-west-3
      - name: Record exact tested main commit for the AWS poller
        run: aws ssm put-parameter --name /sensai/mirror/last-tested-sha --type String --value "$GITHUB_SHA" --overwrite >/dev/null
