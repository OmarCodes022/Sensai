name: Sync merged PR evidence

'on':
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number to replay
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: merge-evidence-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  inactive:
    if: github.repository == 'OmarCodes022/Sensai' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) && vars.SENSAI_EVIDENCE_SYNC_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain disabled evidence sync
        run: |
          echo "::notice::Project/Notion evidence sync is disabled. Configure its scoped credentials and set SENSAI_EVIDENCE_SYNC_ENABLED=true in personal repository Actions variables."
          echo "Project/Notion evidence sync is disabled pending activation. No tracker writes were attempted." >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    if: github.repository == 'OmarCodes022/Sensai' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) && vars.SENSAI_EVIDENCE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q tests/unit

  copilot-summary:
    if: github.repository == 'OmarCodes022/Sensai' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) && vars.SENSAI_EVIDENCE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Summarize and validate landed code (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python scripts/copilot_merge_summary.py --pr "$PR_NUMBER"

  sync:
    if: github.repository == 'OmarCodes022/Sensai' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) && vars.SENSAI_EVIDENCE_SYNC_ENABLED == 'true'
    needs: [unit-tests, copilot-summary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync Project, then Notion (deterministic)
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python scripts/sync_merge_evidence.py --pr "$PR_NUMBER"
