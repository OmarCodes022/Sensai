name: Sync merged PR evidence

'on':
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number to replay
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: merge-evidence-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  unit-tests:
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q tests/unit

  copilot-summary:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Summarize and validate landed code (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python scripts/copilot_merge_summary.py --pr "$PR_NUMBER"

  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    needs: [unit-tests, copilot-summary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync Project, then Notion (deterministic)
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python scripts/sync_merge_evidence.py --pr "$PR_NUMBER"
