name: Review main pushes and sync evidence

'on':
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      before:
        description: Starting commit SHA (exclusive) for a main push to replay
        required: true
        type: string
      after:
        description: Ending commit SHA (inclusive), reachable from main
        required: true
        type: string

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: main-evidence-${{ github.repository }}
  cancel-in-progress: false

jobs:
  inactive:
    if: github.repository == 'OmarCodes022/Sensai' && vars.SENSAI_EVIDENCE_SYNC_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain disabled evidence sync
        run: |
          echo "::notice::Push review and Project/Notion evidence sync are disabled. Configure scoped credentials and set SENSAI_EVIDENCE_SYNC_ENABLED=true."
          echo "Push review and Project/Notion sync are disabled. No tracker writes were attempted." >> "$GITHUB_STEP_SUMMARY"

  review-and-sync:
    if: github.repository == 'OmarCodes022/Sensai' && vars.SENSAI_EVIDENCE_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q tests/unit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Read existing Notion task and feature titles
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BEFORE: ${{ inputs.before || github.event.before }}
          AFTER: ${{ inputs.after || github.sha }}
        run: python scripts/sync_push_evidence.py prepare --before "$BEFORE" --after "$AFTER" --catalog "$RUNNER_TEMP/evidence-catalog.json"
      - name: Review changed code (no tracker credentials)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN || github.token }}
          BEFORE: ${{ inputs.before || github.event.before }}
          AFTER: ${{ inputs.after || github.sha }}
        run: python scripts/sync_push_evidence.py review --before "$BEFORE" --after "$AFTER" --catalog "$RUNNER_TEMP/evidence-catalog.json" --plan "$RUNNER_TEMP/evidence-plan.json"
      - name: Update existing issues, Project, task/feature evidence, and work log
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BEFORE: ${{ inputs.before || github.event.before }}
          AFTER: ${{ inputs.after || github.sha }}
        run: python scripts/sync_push_evidence.py apply --before "$BEFORE" --after "$AFTER" --catalog "$RUNNER_TEMP/evidence-catalog.json" --plan "$RUNNER_TEMP/evidence-plan.json"
